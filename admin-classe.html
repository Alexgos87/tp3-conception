<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervision d'une classe - Ludik</title>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<script src="app.js"></script>
</head>
<body>

<main>
  <a class="back-link" href="admin.html">← Liste des classes</a>
  <div class="eyebrow" id="eyebrow"></div>
  <h2 class="title" id="title"></h2>
  <p class="subtitle" id="subtitle"></p>

  <section class="panel" style="margin-top:30px">
    <h3>Enseignant responsable</h3>
    <div id="prof"></div>
  </section>

  <section class="panel">
    <h3>Badges et critères <small id="badgeCount"></small></h3>
    <p class="hint" style="margin-top:0">
      Règles : critères décrits (au moins <span id="ruleDesc"></span> caractères) et entre <span id="ruleXp"></span> XP par badge.
      L'attribution des badges est réservée aux enseignants de la classe.
    </p>
    <ul class="criteria-list" id="badges"></ul>
  </section>
</main>

<script>
  requireRole("admin");
  const classe = getClasse(qs("id"));
  if (!classe) denyAccess("Cette classe n'existe pas.");

  document.title = classeLabel(classe) + " - Ludik";
  document.getElementById("eyebrow").textContent = "Supervision · " + classe.groupe;
  document.getElementById("title").textContent = classe.nom;
  document.getElementById("subtitle").textContent = plural(studentsOf(classe.id).length, "étudiant") + " inscrit" + (studentsOf(classe.id).length > 1 ? "s" : "");
  document.getElementById("ruleDesc").textContent = REGLES.descriptionMin;
  document.getElementById("ruleXp").textContent = REGLES.xpMin + " et " + REGLES.xpMax;

  let formOpenFor = null;   // badge dont le formulaire de signalement est ouvert
  let changingProf = false;

  function renderProf() {
    const prof = getUser(classe.profId);
    const enseignants = state.users.filter(function (u) { return u.role === "enseignant"; });
    const select = '<select id="profSelect" required><option value="">Choisir un enseignant…</option>' +
      enseignants.map(function (u) {
        return '<option value="' + u.id + '"' + (prof && prof.id === u.id ? " selected" : "") + ">" + esc(fullName(u)) + " (" + esc(u.email) + ")</option>";
      }).join("") + "</select>";

    let html = "";
    if (!prof) {
      html += '<div class="notice warn"><strong>Cette classe n\'a pas d\'enseignant responsable.</strong>Associez-en un pour que les badges puissent être gérés et les anomalies corrigées.</div>';
    } else {
      html += '<ul class="row-list"><li><span class="profile-icon" style="cursor:default">' + esc(initials(prof)) + '</span><span class="grow"><strong>' + esc(fullName(prof)) + '</strong><br><span class="muted">' + esc(prof.email) + "</span></span>" +
        '<span class="muted">' + plural(classesOfProf(prof.id, false).length, "classe") + " en charge</span>" +
        (changingProf ? "" : '<button class="btn secondary small" onclick="changingProf = true; renderProf()">Changer</button>') + "</li></ul>";
    }
    if (!prof || changingProf) {
      html += '<form class="inline-form" style="margin-top:10px" onsubmit="associer(event)">' + select +
        '<button type="submit" class="btn">' + (prof ? "Confirmer le changement" : "Associer l'enseignant") + "</button>" +
        (prof ? '<button type="button" class="btn secondary" onclick="changingProf = false; renderProf()">Annuler</button>' : "") + "</form>";
    }
    document.getElementById("prof").innerHTML = html;
  }

  function associer(event) {
    event.preventDefault();
    const id = document.getElementById("profSelect").value;
    if (!id) return;
    const ok = commit(function () {
      classe.profId = id;
      addNotificationFor(id, "Vous êtes maintenant l'enseignant responsable de la classe " + classeLabel(classe) + ".");
    });
    if (!ok) return;
    changingProf = false;
    showNotification(fullName(getUser(id)) + " est maintenant responsable de la classe");
    renderProf();
    renderBadges();
  }

  function signalementHtml(b) {
    const prof = getUser(classe.profId);
    const active = activeSignalement(b.id);
    const issues = badgeIssues(b);

    if (active && active.statut === "ouvert") {
      return '<div class="notice" style="margin:12px 0 0">' + statutHtml(active) +
        '<p style="margin:8px 0 0">« ' + esc(active.message) + ' »</p><p class="hint" style="margin:4px 0 0">Signalé ' + relativeDate(active.date) + " à " + esc(fullName(prof)) + ".</p></div>";
    }
    if (active && active.statut === "corrige") {
      return '<div class="notice" style="margin:12px 0 0">' + statutHtml(active) +
        '<p style="margin:8px 0 0">Demande : « ' + esc(active.message) + ' »</p>' +
        '<p class="hint" style="margin:4px 0 10px">Corrigé ' + relativeDate(active.dateCorrection) + " par l'enseignant. Vérifiez les critères ci-dessus.</p>" +
        '<div class="inline-form"><button class="btn small" onclick="valider(\'' + active.id + '\')">Valider la correction</button>' +
        '<button class="btn secondary small" onclick="rouvrir(\'' + active.id + '\')">Rouvrir le signalement</button></div></div>';
    }
    if (formOpenFor === b.id) {
      const preset = issues.length ? issues.join(". ") + "." : "";
      return '<form class="stack" style="margin-top:12px" onsubmit="signaler(event, \'' + b.id + '\')">' +
        '<label for="msg-' + b.id + '">Message à ' + esc(fullName(prof)) + "</label>" +
        '<textarea id="msg-' + b.id + '" required placeholder="Décrivez ce qui doit être corrigé">' + esc(preset) + "</textarea>" +
        '<div class="inline-form"><button type="submit" class="btn small">Envoyer à l\'enseignant</button>' +
        '<button type="button" class="btn secondary small" onclick="formOpenFor = null; renderBadges()">Annuler</button></div></form>';
    }
    if (!prof) {
      return '<p class="hint" style="margin-top:10px">Associez un enseignant à la classe pour pouvoir signaler une anomalie.</p>';
    }
    return '<button class="' + (issues.length ? "btn" : "btn secondary") + ' small" style="margin-top:12px" onclick="formOpenFor = \'' + b.id + '\'; renderBadges()">⚑ Signaler une anomalie</button>';
  }

  function renderBadges() {
    const badges = badgesOf(classe.id);
    document.getElementById("badgeCount").textContent = plural(badges.length, "badge");
    document.getElementById("badges").innerHTML = badges.length
      ? badges.map(function (b) {
          const issues = badgeIssues(b);
          const closed = signalementsOf(b.id).filter(function (s) { return s.statut === "ferme"; }).length;
          return '<li id="badge-' + b.id + '">' + medalHtml(b) + '<div style="flex:1">' +
            "<h4>" + esc(b.nom) + " · +" + b.xp + " XP" + (b.cumulable ? ' <span class="tag muted">Cumulable</span>' : "") + "</h4>" +
            "<p>" + (b.description ? esc(b.description) : "<em>Aucun critère décrit.</em>") + "</p>" +
            '<div class="status">' + (issues.length
              ? issues.map(function (i) { return '<span class="tag warn">' + esc(i) + "</span>"; }).join(" ")
              : "✓ Conforme aux règles") +
            " · obtenu par " + plural(holdersOf(b.id).length, "étudiant") + (closed ? " · " + plural(closed, "signalement") + " réglé" + (closed > 1 ? "s" : "") : "") + "</div>" +
            signalementHtml(b) + "</div></li>";
        }).join("")
      : '<li class="empty">Aucun badge n\'est défini pour cette classe.</li>';
  }

  function signaler(event, badgeId) {
    event.preventDefault();
    const message = document.getElementById("msg-" + badgeId).value.trim();
    const badge = getBadge(badgeId);
    const ok = commit(function () {
      state.signalements.push({
        id: newId("sg"), badgeId: badgeId, classeId: classe.id, auteurId: getCurrentUser().id,
        message: message, statut: "ouvert", date: new Date().toISOString(), dateCorrection: null
      });
      addNotificationFor(classe.profId, "L'administration a signalé une anomalie sur le badge « " + badge.nom + " » (" + classeLabel(classe) + ").");
    });
    if (!ok) return;
    formOpenFor = null;
    showNotification("Anomalie signalée à " + fullName(getUser(classe.profId)));
    renderBadges();
  }

  function findSignalement(id) {
    return state.signalements.find(function (s) { return s.id === id; });
  }

  function valider(id) {
    if (!commit(function () { findSignalement(id).statut = "ferme"; })) return;
    showNotification("Correction validée");
    renderBadges();
  }

  function rouvrir(id) {
    const message = prompt("Qu'est-ce qui doit encore être corrigé ?", findSignalement(id).message);
    if (message === null) return;
    const ok = commit(function () {
      const s = findSignalement(id);
      s.statut = "ouvert";
      s.message = message.trim() || s.message;
      s.date = new Date().toISOString();
      addNotificationFor(classe.profId, "La correction du badge « " + getBadge(s.badgeId).nom + " » doit être revue (" + classeLabel(classe) + ").");
    });
    if (!ok) return;
    showNotification("Signalement rouvert");
    renderBadges();
  }

  renderProf();
  renderBadges();
  if (location.hash) {
    const target = document.querySelector(location.hash);
    if (target) target.scrollIntoView();
  }
</script>

</body>
</html>
