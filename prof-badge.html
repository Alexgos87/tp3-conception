<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion d'un badge - Ludik</title>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<script src="app.js"></script>
</head>
<body>

<main>
  <a class="back-link" id="backLink">← Retour à la classe</a>
  <div class="eyebrow" id="eyebrow"></div>
  <div class="notice" id="sharedNote" style="margin-top:15px" hidden></div>

  <form id="badgeForm" onsubmit="enregistrer(event)">
    <div class="badge-editor" style="margin-top:15px">
      <div class="stack" style="display:flex; flex-direction:column; gap:22px">
        <div class="edit-field title-field">
          <input type="text" id="nom" placeholder="Nom du badge (ex. 80 % à l'examen 1)" required aria-label="Nom du badge">
          <button type="button" class="pencil" data-focus="nom" title="Modifier"></button>
        </div>

        <div>
          <label for="description">Description et critères d'attribution</label>
          <div class="edit-field">
            <textarea id="description" placeholder="Ce que l'étudiant doit accomplir pour obtenir ce badge" required></textarea>
            <button type="button" class="pencil" data-focus="description" title="Modifier"></button>
          </div>
        </div>

        <div>
          <label for="xp">XP accordés</label>
          <div class="edit-field" style="max-width:200px">
            <input type="number" id="xp" min="0" max="500" required>
            <button type="button" class="pencil" data-focus="xp" title="Modifier"></button>
          </div>
        </div>

        <label style="display:flex; gap:10px; align-items:center; font-weight:normal">
          <input type="checkbox" id="cumulable">
          Badge cumulable (peut être attribué plusieurs fois au même étudiant)
        </label>
      </div>

      <div class="image-box">
        <div id="medalPreview"></div>
        <div class="symbol-pick" id="symbols"></div>
        <label class="btn secondary small" style="font-weight:bold">
          Changer l'image
          <input type="file" id="imageInput" accept="image/*" hidden>
        </label>
        <button type="button" class="link-btn" id="removeImage" hidden>Retirer l'image</button>
      </div>
    </div>

    <section class="panel" style="margin-top:30px">
      <h3>Étudiants avec ce badge <small id="holderCount"></small></h3>
      <ul class="row-list" id="holders"></ul>
      <div class="inline-form" style="margin-top:15px">
        <select id="addHolder"></select>
        <button type="button" class="add-square" title="Ajouter" onclick="ajouterDetenteur()">+</button>
      </div>
      <p class="hint">Les changements de cette liste sont appliqués à l'enregistrement.</p>
    </section>

    <div class="buttons">
      <button type="button" class="btn danger" id="deleteBtn" onclick="supprimer()">Supprimer le badge</button>
      <button type="submit" class="btn">Enregistrer</button>
    </div>
  </form>
</main>

<script>
  const user = requireRole("enseignant");
  const existing = qs("id") ? getBadge(qs("id")) : null;
  if (qs("id") && !existing) denyAccess("Ce badge n'existe pas.");

  // Un badge appartient soit à une classe, soit à une alliance (partagé par toutes ses classes)
  const alliance = getAlliance(existing ? existing.allianceId : qs("alliance"));
  const classe = alliance ? null : getClasse(existing ? existing.classeId : qs("classe"));
  if (alliance) requireAllianceMember(alliance, user);
  else requireOwnClasse(classe, user);

  // Classes de cet enseignant où il peut attribuer le badge
  const myClasses = alliance
    ? allianceClasses(alliance).filter(function (c) { return c.profId === user.id; })
    : [classe];
  const retour = getClasse(qs("retour"));
  const backHref = retour && retour.profId === user.id
    ? "prof-classe.html?id=" + retour.id
    : alliance ? "prof-alliance.html?id=" + alliance.id : "prof-classe.html?id=" + classe.id;

  // Brouillon modifié par la page ; rien n'est sauvegardé avant « Enregistrer »
  const draft = existing
    ? Object.assign({}, existing)
    : Object.assign({ id: newId("b"), nom: "", description: "", xp: 20, cumulable: false, symbole: "★", image: null },
        alliance ? { allianceId: alliance.id } : { classeId: classe.id });
  const holders = new Set(existing ? myHolders() : []);

  document.title = (existing ? existing.nom : "Nouveau badge") + " - Ludik";
  document.getElementById("backLink").href = backHref;
  document.getElementById("backLink").textContent = retour ? "← Retour à la classe" : alliance ? "← Retour à l'alliance" : "← Retour à la classe";
  document.getElementById("eyebrow").textContent = (existing ? "Gestion du badge · " : "Nouveau badge · ") +
    (alliance ? "Alliance " + alliance.nom : classeLabel(classe));
  if (alliance) {
    const others = allianceClasses(alliance).filter(function (c) { return c.profId !== user.id; });
    const note = document.getElementById("sharedNote");
    note.hidden = false;
    note.innerHTML = "<strong>Badge partagé par les " + plural(allianceClasses(alliance).length, "classe") + " de l'alliance.</strong>" +
      "Vos modifications s'appliquent à toutes ces classes" +
      (others.length ? ", y compris " + others.map(function (c) { return esc(classeLabel(c)) + " (" + esc(fullName(getUser(c.profId))) + ")"; }).join(", ") : "") +
      ". Vous l'attribuez uniquement à vos propres étudiants.";
  }

  // Étudiants de mes classes, avec la classe où leurs XP seront comptés
  function myStudents() {
    const list = [];
    myClasses.forEach(function (c) {
      studentsOf(c.id).forEach(function (s) {
        if (!list.some(function (x) { return x.etudiant.id === s.id; })) list.push({ etudiant: s, classe: c });
      });
    });
    return list;
  }

  function myHolders() {
    return myStudents()
      .filter(function (x) { return hasBadge(x.etudiant.id, draft.id); })
      .map(function (x) { return x.etudiant.id; });
  }
  document.getElementById("nom").value = draft.nom;
  document.getElementById("description").value = draft.description;
  document.getElementById("xp").value = draft.xp;
  document.getElementById("cumulable").checked = !!draft.cumulable;
  document.getElementById("deleteBtn").hidden = !existing;

  document.querySelectorAll(".pencil").forEach(function (b) {
    b.innerHTML = ICONS.pencil;
    b.addEventListener("click", function () { document.getElementById(b.dataset.focus).focus(); });
  });

  function renderImage() {
    document.getElementById("medalPreview").innerHTML = medalHtml(draft, { size: "lg" });
    document.getElementById("symbols").innerHTML = SYMBOLES.map(function (s) {
      return '<button type="button" class="' + (!draft.image && draft.symbole === s ? "active" : "") + '" data-s="' + s + '">' + s + "︎</button>";
    }).join("");
    document.querySelectorAll("#symbols button").forEach(function (b) {
      b.addEventListener("click", function () {
        draft.symbole = b.dataset.s;
        draft.image = null;
        renderImage();
      });
    });
    document.getElementById("removeImage").hidden = !draft.image;
  }

  document.getElementById("imageInput").addEventListener("change", function (e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500000) {
      showNotification("Image trop lourde (500 Ko maximum)");
      return;
    }
    const reader = new FileReader();
    reader.onload = function () {
      draft.image = reader.result;
      renderImage();
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("removeImage").addEventListener("click", function () {
    draft.image = null;
    renderImage();
  });

  function renderHolders() {
    const students = myStudents();
    const list = students.filter(function (x) { return holders.has(x.etudiant.id); });
    const showClass = myClasses.length > 1;
    let count = list.length + " / " + students.length;
    if (alliance && existing) count += " dans vos classes · " + holdersOf(existing.id).length + " / " + badgeAudience(existing) + " dans l'alliance";
    document.getElementById("holderCount").textContent = count;
    document.getElementById("holders").innerHTML = list.length
      ? list.map(function (x) {
          return '<li><span class="grow">' + esc(fullName(x.etudiant)) + (showClass ? ' <span class="muted">· ' + esc(x.classe.groupe) + "</span>" : "") +
            '</span><button type="button" class="link-btn" onclick="retirerDetenteur(\'' + x.etudiant.id + '\')">Retirer</button></li>';
        }).join("")
      : '<li class="empty">' + (alliance ? "Aucun de vos étudiants n'a encore ce badge." : "Personne n'a encore ce badge.") + "</li>";
    document.getElementById("addHolder").innerHTML = '<option value="">Attribuer à…</option>' +
      students.filter(function (x) { return !holders.has(x.etudiant.id); }).map(function (x) {
        return '<option value="' + x.etudiant.id + '">' + esc(fullName(x.etudiant)) + (showClass ? " (" + esc(x.classe.groupe) + ")" : "") + "</option>";
      }).join("");
  }

  function ajouterDetenteur() {
    const id = document.getElementById("addHolder").value;
    if (!id) return;
    holders.add(id);
    renderHolders();
  }

  function retirerDetenteur(id) {
    holders.delete(id);
    renderHolders();
  }

  function enregistrer(event) {
    event.preventDefault();
    draft.nom = document.getElementById("nom").value.trim();
    draft.description = document.getElementById("description").value.trim();
    draft.xp = parseInt(document.getElementById("xp").value, 10) || 0;
    draft.cumulable = document.getElementById("cumulable").checked;

    const ok = commit(function () {
      if (existing) {
        Object.assign(existing, draft);
        // Les XP déjà accordés suivent la nouvelle valeur du badge
        state.attributions.forEach(function (a) {
          if (a.badgeId === existing.id) a.xp = existing.xp;
        });
      } else {
        state.badges.push(draft);
      }

      // Seuls mes étudiants sont touchés, même pour un badge d'alliance
      const before = existing ? myHolders() : [];
      const students = myStudents();
      holders.forEach(function (id) {
        if (before.includes(id)) return;
        const x = students.find(function (s) { return s.etudiant.id === id; });
        giveBadge(draft.id, id, x.classe.id);
      });
      before.forEach(function (id) {
        if (!holders.has(id)) revokeBadge(draft.id, id);
      });
    });
    if (!ok) return;
    window.location.href = backHref;
  }

  function supprimer() {
    const scope = alliance ? " pour toutes les classes de l'alliance" : "";
    if (!confirm("Supprimer le badge « " + existing.nom + " »" + scope + " ? Les XP qu'il a donnés seront retirés aux étudiants.")) return;
    const ok = commit(function () {
      state.badges = state.badges.filter(function (b) { return b.id !== existing.id; });
      state.attributions = state.attributions.filter(function (a) { return a.badgeId !== existing.id; });
    });
    if (!ok) return;
    window.location.href = backHref;
  }

  renderImage();
  renderHolders();
</script>

</body>
</html>
