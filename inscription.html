<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription - Ludik</title>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<script src="app.js"></script>
</head>
<body>

<main class="narrow">
  <h2 style="text-align:center; margin-bottom:30px;">S'inscrire</h2>
  <form class="stack" onsubmit="sInscrire(event)">
    <label for="nom">Nom</label>
    <input type="text" id="nom" autocomplete="family-name" required>

    <label for="prenom">Prénom</label>
    <input type="text" id="prenom" autocomplete="given-name" required>

    <label for="email">Courriel</label>
    <input type="email" id="email" autocomplete="email" required>

    <label for="username">Nom d'utilisateur</label>
    <input type="text" id="username" autocomplete="username" required>

    <label for="password">Mot de passe</label>
    <input type="password" id="password" autocomplete="new-password" minlength="4" required>

    <label>Je suis</label>
    <div class="role-choice">
      <label><input type="radio" name="role" value="etudiant" checked><span>Étudiant</span></label>
      <label><input type="radio" name="role" value="enseignant"><span>Enseignant</span></label>
    </div>

    <div class="buttons">
      <a class="btn secondary" href="connexion.html">Se connecter</a>
      <button type="submit" class="btn">S'inscrire</button>
    </div>
  </form>
</main>

<script>
  function sInscrire(event) {
    event.preventDefault();
    const username = document.getElementById("username").value.trim();
    if (usernameTaken(username)) {
      showNotification("Ce nom d'utilisateur est déjà pris");
      return;
    }
    const user = {
      id: newId("u"),
      username: username,
      password: document.getElementById("password").value,
      prenom: document.getElementById("prenom").value.trim(),
      nom: document.getElementById("nom").value.trim(),
      email: document.getElementById("email").value.trim(),
      role: document.querySelector("input[name=role]:checked").value
    };
    state.users.push(user);
    saveState();
    login(user);
    window.location.href = homeFor(user);
  }
</script>

</body>
</html>
