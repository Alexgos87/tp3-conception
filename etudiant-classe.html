<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classe - Ludik</title>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<script src="app.js"></script>
</head>
<body>

<main>
  <a class="back-link" href="etudiant.html">← Mes classes</a>
  <div class="eyebrow" id="eyebrow"></div>
  <h2 class="title" id="title"></h2>
  <p class="subtitle" id="subtitle"></p>

  <div class="grid-2" style="margin-top:30px">
    <section class="panel">
      <h3>Ma progression</h3>
      <div class="stats" style="grid-template-columns:1fr 1fr; gap:10px">
        <div class="stat"><strong id="myRank"></strong><span>Rang</span></div>
        <div class="stat"><strong id="myXp"></strong><span>XP</span></div>
      </div>
      <div id="myProgress" style="margin-top:15px"></div>
    </section>
    <section class="panel">
      <h3>Classement</h3>
      <ul class="rank-list" id="rank"></ul>
    </section>
  </div>

  <section class="panel" style="margin-top:20px" id="badges-section">
    <h3>Badges <small id="badgeCount"></small></h3>
    <p class="hint" style="margin-top:0">Sélectionnez un badge pour voir ses critères et son statut.</p>
    <ul class="choice-list" id="badges"></ul>
    <div class="legend" id="legend" hidden><span class="medal sm shared">★&#xFE0E;</span> Badge commun à toutes les classes de l'alliance</div>
  </section>

  <div id="allianceRanks"></div>
</main>

<script>
  const user = requireRole("etudiant");
  const classe = getClasse(qs("id"));
  if (!classe || classe.archived || !isEnrolled(user.id, classe.id)) denyAccess("Vous n'êtes pas inscrit à cette classe.");

  document.title = classe.nom + " - Ludik";
  document.getElementById("eyebrow").textContent = "Classe · " + classe.groupe;
  document.getElementById("title").textContent = classe.nom;
  document.getElementById("subtitle").textContent = "Prof. " + fullName(getUser(classe.profId));

  const rows = ranking(classe.id);
  const xp = xpOf(user.id, classe.id);
  const myRow = rows.find(function (r) { return r.etudiant.id === user.id; });
  document.getElementById("myRank").textContent = "#" + myRow.rang + " / " + rows.length;
  document.getElementById("myXp").textContent = xp;
  document.getElementById("myProgress").innerHTML = progressHtml(xp) +
    '<p class="hint">Encore ' + (XP_PAR_NIVEAU - levelInfo(xp).dansNiveau) + " XP avant le niveau " + (levelInfo(xp).niveau + 1) + ".</p>";

  // Le podium, puis la position de l'étudiant s'il n'y figure pas (on n'affiche pas le dernier rang)
  function rankLine(r) {
    const me = r.etudiant.id === user.id;
    return '<li class="' + (me ? "me" : "") + '"><span class="pos">#' + r.rang + '</span><span class="name">' +
      esc(fullName(r.etudiant)) + (me ? " (vous)" : "") + '</span><span class="xp">' +
      (r.classe ? esc(r.classe.groupe) + " · " : "") + r.xp + " XP</span></li>";
  }
  function podiumHtml(list, mine) {
    const podium = list.slice(0, 3);
    let html = podium.map(rankLine).join("");
    if (mine && !podium.includes(mine)) {
      html += '<li class="gap">⋮</li>' + rankLine(mine);
    }
    return html;
  }
  document.getElementById("rank").innerHTML = podiumHtml(rows, myRow);

  // Classement commun de chaque alliance dont la classe fait partie
  document.getElementById("allianceRanks").innerHTML = alliancesOfClasse(classe.id).map(function (a) {
    const list = allianceRanking(a);
    const mine = list.find(function (r) { return r.etudiant.id === user.id && r.classe.id === classe.id; });
    const groupes = allianceClasses(a).map(function (c) { return c.groupe; }).join(", ");
    return '<section class="panel"><h3>Classement de l\'alliance « ' + esc(a.nom) + " » <small>" + esc(groupes) + "</small></h3>" +
      '<ul class="rank-list">' + podiumHtml(list, mine) + "</ul>" +
      '<p class="hint">Votre position parmi les ' + plural(list.length, "étudiant") + " des classes de l'alliance.</p></section>";
  }).join("");

  const badges = badgesOf(classe.id);
  const earned = badgesEarned(user.id, classe.id);
  document.getElementById("badgeCount").textContent = earned.length + " / " + badges.length + " obtenus";
  document.getElementById("badges").innerHTML = badges.length
    ? badges.map(function (b) {
        const n = countBadge(user.id, b.id);
        const status = n
          ? '<span class="tag">✓ Obtenu' + (n > 1 ? " ×" + n : "") + "</span>"
          : '<span class="tag muted">À obtenir</span>';
        return '<li><button type="button" onclick="location.href=\'etudiant-badge.html?id=' + b.id + "&classe=" + classe.id + '\'">' + medalHtml(b, { locked: !n }) +
          '<span class="grow"><strong>' + esc(b.nom) + '</strong><br><span class="hint">+' + b.xp + " XP" +
          (b.allianceId ? " · " + esc(badgeScopeLabel(b)) : "") + "</span></span>" + status + " →</button></li>";
      }).join("")
    : '<li class="empty">Aucun badge disponible pour cette classe.</li>';
  document.getElementById("legend").hidden = !badges.some(function (b) { return b.allianceId; });
</script>

</body>
</html>
